<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Auth Dashboard</div>
        <div class="nav-links">
            <a href="#" class="active" id="homeLink">Home</a>
            <a href="#" id="signinLink">Sign In</a>
            <a href="#" id="signupLink">Sign Up</a>
            <a href="#" id="dashboardLink" style="display: none;">Dashboard</a>
            <a href="#" id="logoutLink" style="display: none;">Logout</a>
        </div>
    </nav>

    <main>
        <!-- Home Section -->
        <section id="homeSection" class="section">
            <h1>Welcome to Our Platform</h1>
            <div class="cards-container">
                <div class="card">
                    <h3>Feature 1</h3>
                    <p>Description of feature 1</p>
                </div>
                <div class="card">
                    <h3>Feature 2</h3>
                    <p>Description of feature 2</p>
                </div>
                <div class="card">
                    <h3>Feature 3</h3>
                    <p>Description of feature 3</p>
                </div>
            </div>
        </section>

        <!-- Sign In Section -->
        <section id="signinSection" class="section" style="display: none;">
            <h2>Sign In</h2>
            <form id="signinForm" class="auth-form">
                <input type="text" id="signinUsername" placeholder="Username" required>
                <input type="password" id="signinPassword" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>
        </section>

        <!-- Sign Up Section -->
        <section id="signupSection" class="section" style="display: none;">
            <h2>Sign Up</h2>
            <form id="signupForm" class="auth-form">
                <input type="text" id="signupUsername" placeholder="Username" required>
                <input type="password" id="signupPassword" placeholder="Password" required>
                <select id="signupRole" required>
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
                <button type="submit">Sign Up</button>
            </form>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboardSection" class="section" style="display: none;">
            <h2>Dashboard</h2>
            <div id="dashboardContent">
                <p>Welcome to your dashboard!</p>
                <div id="userInfo"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
